
<!DOCTYPE html>
<html>
<head>
    <title>Mouse Over Event</title>
</head>
<center>
<body>
<h2>Move the mouse over the image</h2>
<div onmouseover="newContent()" onmouseout="changeContent()">
<img id="myImage"
src="C:/Users/Admin/mouseclick/pexels-luchik-39784911.jpg"width="200"height="150"alt="Original Image">
<h3 id="myText">This is the Original Image</h3>
</div>
<script>
function newContent() {
document.getElementById("myImage").src ="C:/Users/Admin/mouseclick/pexels-travel-with-lenses-734723610-40080800.jpg";
document.getElementById("myText").innerHTML ="This is the New Image";
}
function changeContent() {
document.getElementById("myImage").src ="C:/Users/Admin/mouseclick/pexels-luchik-39784911.jpg";
document.getElementById("myText").innerHTML ="This is the Original Image";
}
</script>
</center>
</body>
</html>
